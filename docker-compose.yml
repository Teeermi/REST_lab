services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: auctiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auctiondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "5001:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=auctiondb;Username=postgres;Password=postgres
      - Jwt__Key=SuperSecretKeyForAuctionSystemJwtAuth2024!
      - Jwt__Issuer=AuctionSystem
      - Jwt__Audience=AuctionSystemUsers
      - Cors__AllowedOrigins=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
