services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: auctiondb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=auctiondb;Username=postgres;Password=postgres
      - Jwt__Key=SuperSecretKeyForAuctionSystemJwtAuth2024!
      - Jwt__Issuer=AuctionSystem
      - Jwt__Audience=AuctionSystemUsers
    depends_on:
      - db

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
